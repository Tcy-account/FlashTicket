# FlashTicket 生产部署 Nginx 配置（M17-04）
# 拓扑：
#   /            → 用户端 ticket-web（静态）
#   /admin/      → 管理端 admin-web（静态）
#   /api/v1/     → 后端 8080（API 反代）
#   /actuator/   → 后端 8080（健康检查 / Prometheus 指标）
# 本地开发仍用 Vite dev server + 后端直连，此配置用于生产/单端口交付。

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # 用户端静态资源
    root /usr/share/nginx/html/ticket-web;
    index index.html;

    # 管理端静态资源
    location /admin/ {
        alias /usr/share/nginx/html/admin-web/;
        try_files $uri $uri/ /admin/index.html;
    }

    # API 反代到后端
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Actuator（健康检查 / Prometheus）
    location /actuator/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }

    # 用户端 SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
