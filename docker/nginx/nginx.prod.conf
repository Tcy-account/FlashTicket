# FlashTicket 生产网关（宿主机无域名，纯 IP + 端口）
# 一个 nginx 容器内两个 server：
#   80   → 用户端 ticket-web（宿主机 8080）
#   8081 → 管理端 admin-web（宿主机 8081）
# 两个站点各自反代 /api 到同一后端，浏览器视角是同源请求，Cookie 与 SSE 都正常。
#
# 为什么不用 /admin/ 子路径：admin-web 的 vue-router 是 createWebHistory() 无 base，
# Vite 默认 base:'/'，挂到子路径会白屏 + 资源 404。分端口是最省事的正解。

# ---------- 用户端 ----------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/ticket-web;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SSE 实时通知：必须关闭缓冲，否则前端收不到推送（M14）
    location = /api/v1/notifications/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端限流按 X-Forwarded-For 首段取客户端 IP（ClientIpUtils），
        # 不透传会让所有访客共用 nginx 容器 IP 的限流桶。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退：index.html 不缓存，避免发版后客户端拿到旧壳
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ---------- 管理端 ----------
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html/admin-web;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
