# FlashTicket 生产 RocketMQ Broker（1G 内存 / 30G 盘）
# 与本地 broker.conf 的差异：保留时间缩短、磁盘阈值放宽。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
# 30G 小盘：消息只留 24 小时，够定位问题又不占空间
fileReservedTime = 24
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
# RocketMQ 默认磁盘使用率超过 85% 就拒绝写入（OS_PAGE_BUSY / disk full）。
# 30G 盘要装镜像 + 数据 + 日志，很容易踩到 85%，放宽到 95% 给运维留缓冲。
diskMaxUsedSpaceRatio = 95
# 单机低配：减少线程数，2 核机器开太多线程只增加上下文切换
sendMessageThreadPoolNums = 8
pullMessageThreadPoolNums = 8
