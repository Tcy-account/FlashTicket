# FlashTicket 本地开发 RocketMQ Broker 配置（挂载进 apache/rocketmq:5.3.0 容器）
# 单机 ASYNC_MASTER，开启自动建 Topic，便于本地开发免手工 mqadmin updatetopic。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
# 显式指定存储路径（挂载卷），避免容器内 ~/store 解析失败导致启动 NPE
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
